services:
  app:
    build: 
      context: ./docker-image/app/
      dockerfile: Dockerfile
    container_name: app
    image: ${IMAGE_NAME}:${IMAGE_VERSION}
    restart: always
    volumes:
      - ./app:/app
      - ./data/app_storage:/app/storage
      - ./data/app_bootstrap_cache:/app/bootstrap/cache
    depends_on:
      - database
    ports:
      - "127.0.0.1:5173:5173"

    # 🔥 Resource limit
    mem_limit: 512m
    cpus: "0.50"

    command: >
      sh -c "
        mkdir -p /app/storage/framework/sessions
        mkdir -p /app/storage/framework/views
        mkdir -p /app/storage/framework/cache
        mkdir -p /app/storage/logs
        chmod -R 775 /app/storage /app/bootstrap/cache &&
        chown -R www-data:1000 /app/storage /app/bootstrap/cache &&
        php-fpm
      "

  web:
    image: nginx:1.26.3-bookworm
    container_name: web
    ports:
      - "8800:80"
    restart: always
    volumes:
      - ./app:/app
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

    # 🔥 Resource limit
    mem_limit: 256m
    cpus: "0.25"

  database:
    image: postgres:17-bookworm
    container_name: database
    restart: always
    volumes:
      - ./data/postgresql:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5501:5432"

    # 🔥 Resource limit
    mem_limit: 512m
    cpus: "0.50"